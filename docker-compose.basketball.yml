# INTERNATIONAL BASKETBALL RECORDING overlay (2026-09-27).
#
#   docker compose -f docker-compose.yml -f docker-compose.basketball.yml up -d --build basketball-recorder
#
# RECORDING ONLY: pregame board sweeps of the venue's international basketball
# competitions (core/leagues.py `basketball-intl`: EuroLeague, Mexico's LNBP, Germany's BBL,
# VTB, BSL, and the Danish, Slovenian and Hungarian leagues). One winner market
# per game, no spread or total ladder, so nothing here can be paired or placed.
# In-play tapes come from the stream recorder the daily scheduler launches for
# these tags as recorder-only leagues. One heartbeat row (pregame_recorder_basketball-intl).
services:
  basketball-recorder:
    build: .
    container_name: meridian-basketball-recorder
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${MERIDIAN_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
      MERIDIAN_LEAGUE: basketball-intl
      MERIDIAN_RPS: "2"
      # A basketball game is ~2 h and the board is listed days ahead; the near
      # window tightens three hours before tip, the idle sweep is every 15 min.
      MERIDIAN_NEAR_TIPOFF_HOURS: "3"
      MERIDIAN_INTERVAL_NEAR: "60"
      MERIDIAN_INTERVAL_IDLE: "900"
      MERIDIAN_EVENT_LIMIT: "500"
