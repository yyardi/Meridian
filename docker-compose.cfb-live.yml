# College-football signal side. Separate overlay from espn-live because it is
# a different sport with a different payload shape and its own tables.
#
#     docker compose -f docker-compose.yml -f docker-compose.cfb-live.yml up -d cfb-espn-recorder
#
# Why it exists: on 2026-09-05 we held 56,948 CFB shadow fills across 48 games
# and zero rows of CFB game state. The market was recorded and the game was
# not, so no fair value model for football was possible at all.
#
# The WNBA recorder cannot cover this. Its SUMMARY_URL is a module constant
# pinned to basketball/wnba, and — the part that would have failed silently —
# `summary.plays` is EMPTY for football, whose plays live under `drives`. A
# basketball parser here writes nothing while every heartbeat stays green.
#
# NAME COLLISION, 2026-09-05: this service and container were originally both
# called `cfb-live-recorder` / `meridian-cfb-live-recorder` -- THE SAME NAMES
# docker-compose.nfl.yml:108 uses for the CFB VENUE PRICE recorder
# (core.live_recorder --interval 1.0). Bringing this one up DESTROYED that one,
# and CFB venue price recording stopped for 22 hours before anyone noticed:
# 188,394 rows in the 22:00Z hour before, 4,638-9,371/hour after (sweep only).
# Two different recorders, two different jobs; the names now say so.
#
# No credentials exist to mount: ESPN is unauthenticated. Reads ESPN, writes
# only its own three tables. Deploy stays operator-gated between slates.
services:
  cfb-espn-recorder:
    build: .
    container_name: meridian-cfb-espn-recorder
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # LOCAL, like every recorder: signals join the tick stream in replays.
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      # A 68-game Saturday runs ~20 concurrent live games: scoreboard/60s plus
      # summary/20s per live game is ~1.0 req/s of this 3.
      ESPN_RPS: "3"
      ESPN_LEAGUE_PATH: "football/college-football"
    # alembic upgrade first: these tables are newer than any running deploy.
    # Concurrent upgrades are safe (advisory lock).
    command: ["sh", "-c", "alembic upgrade head && python -m core.feeds.espn_cfb_recorder"]

  # NFL game state. SAME image, SAME parser, SAME tables -- separated by the
  # `league` column, because NFL plays carry the same down/distance/
  # yards-to-goal/possession as college ones. Verified against the venue:
  # `eventState` is game-state gated rather than league gated, so NFL grows one
  # at kickoff and needs no NFL-specific branch.
  #
  # WEEK 1 OPENS 2026-09-10 WITH ONE GAME, then 12 games on 09-13. The opener
  # is the dress rehearsal; a failure there is recoverable before Sunday, which
  # is why this wants to be up BEFORE the 10th rather than on it.
  #
  # Distinct container_name, deliberately: reusing one destroyed the CFB venue
  # price recorder on 2026-09-05 and cost 22 hours of tape.
  nfl-espn-recorder:
    build: .
    container_name: meridian-nfl-espn-recorder
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      ESPN_RPS: "3"
      ESPN_LEAGUE_PATH: "football/nfl"
    command: ["sh", "-c", "alembic upgrade head && python -m core.feeds.espn_cfb_recorder --league nfl"]
