# The QUOTE shadow engine, as a compose OVERLAY:
#
#     docker compose -f docker-compose.yml -f docker-compose.quote.yml up -d quote-engine
#
# A separate file, deliberately: docker-compose.yml was carrying another
# session's uncommitted work when this shipped, and editing it would have
# swept that work into an unrelated commit. Fold this block into the main
# file when it is clean (docs/math/quote-shadow.md, ops notes).
#
# Shadow only: the engine reads the LOCAL tick database, writes simulated
# fills and one heartbeat back to it, and touches the venue only through the
# public settlement endpoint. No credentials are mounted because none are
# needed — the absence of POLYMARKET_* below is load-bearing.
services:
  quote-engine:
    build:
      context: .
      args:
        # Required: deploy via scripts/deploy_engine.sh, which sets it from
        # git. An empty value makes the engine refuse to start (amendment 12
        # fail-closed) — that is the intended behaviour, not an outage to
        # work around by unsetting the check.
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: meridian-quote-engine
    # engine_v2 = v1's quoting UNCHANGED (subclass inherits cycle(); replay-
    # equivalence proven byte-identical on the pinned Aug tape) + the
    # observation recording path (quote_v2_observations, ≤1s, the quoter's
    # OWN stamps per the B14 fix, detector live). Switched 2026-09-02 under
    # amendment 10's freeze-rebind; the rebind line in
    # docs/math/quote-v2-program.md cites the proofs and the fixed binary.
    command: python -m core.quote.engine_v2
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      MERIDIAN_QUOTE_INTERVAL_SECONDS: "5"
      MERIDIAN_QUOTE_SETTLE_EVERY_SECONDS: "600"
    depends_on:
      - postgres
    restart: unless-stopped

  # GRIDIRON — the NFL quote engine. The SAME image and the SAME engine_v2 as
  # the WNBA quote-engine above; the ONLY difference is MERIDIAN_LEAGUE=nfl,
  # which routes the engine to quote/observe NFL slugs only (amendment 12: league
  # is by slug on the read AND write paths) and gives it its own heartbeat key
  # (quote_engine_nfl) and container so health.py/§4b see it independently. It is
  # OUTSIDE the WNBA freeze — separate binary, separate container, NFL-only — so
  # it needs no replay proof against the basketball tape. Deploy exactly like the
  # WNBA engine so the identity stamp cannot be forgotten:
  #
  #     scripts/deploy_engine.sh gridiron-engine docker-compose.quote.yml
  #
  # Its DEPLOY COMMIT is GRIDIRON's substrate epoch (cohort ruling) — record the
  # stamp the deploy reads back, don't infer it later.
  #
  # HONEST SCOPE (carry into GRIDIRON's registration, docs/gridiron/program.md):
  # its fills are MODELLED, like every shadow fill this program has produced —
  # the operator's hand probe remains the only source of REAL first-slate fill
  # data. And the NFL board has never been measured: every claim built on this
  # stream is PROVISIONAL until the first-data count runs (a required GRIDIRON
  # deliverable), which cannot happen before the first slate — building blind, on
  # purpose, with the debt recorded here where the deployer meets it.
  gridiron-engine:
    build:
      context: .
      args:
        # Same fail-closed stamp as the WNBA engine (amendment 12): deploy via
        # scripts/deploy_engine.sh, which sets GIT_COMMIT from git; empty makes
        # the engine refuse to start.
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: meridian-gridiron-engine
    command: python -m core.quote.engine_v2
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      MERIDIAN_LEAGUE: nfl
      MERIDIAN_QUOTE_INTERVAL_SECONDS: "5"
      MERIDIAN_QUOTE_SETTLE_EVERY_SECONDS: "600"
    depends_on:
      - postgres
    restart: unless-stopped

  # WNBA pregame trade-tape sweeper. Same module, league-parameterized; the
  # board is EMPTY until listings return ~Sept 17, so starting it now costs
  # nothing and captures the trajectory from the FIRST listing rather than
  # from whenever someone remembers. The decision it protects (D): if the
  # WNBA pregame board never trades, D1 would accrue for weeks toward a floor
  # it cannot reach — and we would rather know that before spending the
  # accrual than after.
  wnba-stats-sweeper:
    build: .
    container_name: meridian-wnba-stats-sweeper
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${MERIDIAN_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
      MERIDIAN_LEAGUE: wnba
      MERIDIAN_RPS: "2"
    command: ["python", "-m", "core.feeds.stats_sweeper", "--interval", "3600"]
