[project]
name = "meridian"
version = "0.1.0"
description = "Algorithmic trading system for WNBA prediction markets on Polymarket US"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    # Ed25519 request signing for the authenticated Polymarket US host.
    # Read-only today; the recorder and gateway path never touch it.
    "cryptography>=42",
    "structlog>=24.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "strategies"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# A health check that crashes when one check fails is worse than useless — it
# reports nothing about the other checks. Every `except Exception` there turns a
# failure into a DEAD line and keeps going, which is the entire design.
"scripts/health.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
