[project]
name = "meridian"
version = "0.1.0"
description = "Algorithmic trading system for WNBA prediction markets on Polymarket US"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # The dashboard/API now runs as a container (vacation hardening): the
    # host-venv uvicorn was the one component that died on reboot.
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "tenacity>=8.2",
    # Ed25519 request signing for the authenticated Polymarket US host.
    # Read-only today; the recorder and gateway path never touch it.
    "cryptography>=42",
    "structlog>=24.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# The CFB fair-value trainer. An EXTRA, not a runtime dependency: no service
# imports xgboost, so the recorder/API/engine images stay unchanged and none
# of them rebuild for it. Installed only by the trainer image
# (docker-compose.trainer.yml), which exists because the box's only Python
# outside the containers is .venv-health and it has neither of these.
# numpy/scipy/pandas/statsmodels are already runtime deps and are reused.
model = [
    "xgboost>=2.0",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # scripts/export_wnba_trades.py writes the operator's hand-annotation
    # sheet. A dev extra, not a runtime dependency: no container runs it,
    # so the image needs no rebuild for it.
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "strategies"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# A health check that crashes when one check fails is worse than useless — it
# reports nothing about the other checks. Every `except Exception` there turns a
# failure into a DEAD line and keeps going, which is the entire design.
"scripts/health.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
