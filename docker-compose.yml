services:
  postgres:
    image: postgres:16-alpine
    container_name: meridian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      # 5433 on the host to avoid clashing with any local Postgres on 5432
      - "5433:5432"
    volumes:
      - meridian_pgdata:/var/lib/postgresql/data
      # Tick-archive dumps (core/retention.py): pg_dump runs inside this
      # container — the host has no postgres client tools — and writes here so
      # the archives live on the host, outside the database volume they exist
      # to shrink.
      # Must agree with core/paths.py: BACKUP_DIR_CONTAINER is /backups,
      # the host side is $MERIDIAN_DATA_DIR/ticks (default ./backups/ticks).
      - ${MERIDIAN_DATA_DIR:-./backups}/ticks:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 10

  recorder:
    build: .
    container_name: meridian-recorder
    # The whole point: survives crashes, Docker restarts, and machine reboots.
    # A recorder that dies unattended is the dominant failure mode, and market
    # snapshots cannot be backfilled from anywhere.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Local postgres is the primary since the 2026-08-17 Supabase exit. A
      # future remote (AWS) is one env var: set MERIDIAN_DATABASE_URL.
      DATABASE_URL: ${MERIDIAN_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
      # Two recorders now share one IP and the gateway's ceiling is 20 req/s.
      # The pregame recorder polls hourly and has no latency requirement, so it
      # yields headroom to the live one rather than both sitting at 10 and
      # leaving zero margin. 5 + 12 = 17, under the ceiling.
      MERIDIAN_RPS: "5"

  live-recorder:
    build: .
    container_name: meridian-live-recorder
    # Separate from `recorder` on purpose: that one samples the pregame board
    # every 15-60 min, which is right for slow line drift and useless for
    # anything inside a game. In-game prices travel ~37c peak-to-trough, and
    # both unbuilt strategies (in-game trading, market making) need
    # second-scale resolution to be measurable at all.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # LOCAL, deliberately — not the Supabase URL the others use.
      #
      # This container writes ~657,000 rows a day; everything else in the system
      # writes ~5,900. On a shared-CPU instance that pinned Supabase at 99% CPU
      # while exceeding the free tier, and a write that fails mid-game loses
      # that game permanently: Polymarket publishes no price history, so the
      # tick stream cannot be refetched from anywhere.
      #
      # Nothing is lost by keeping it here. The only consumer is the replay
      # engine and the microstructure experiments, and those are *required* to
      # run against local Postgres anyway (11m28s against Supabase versus 13s
      # locally). The old arrangement uploaded every tick and then downloaded
      # it again via `sync_local --stream`.
      #
      # What Supabase keeps: predictions, odds, resolutions, game logs — the
      # ~5,900 rows/day that actually need to survive this laptop.
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      # Gets the larger share: this is the one with a latency requirement.
      # Measured steady-state demand with a full four-game slate is ~8.9 req/s
      # (5 for the 200ms price loop + near-money depth + a slow deep sweep), so
      # 12 leaves headroom without crowding the gateway's 20 req/s per-IP
      # ceiling. NOT raised when the price loop went from 1s to 200ms — depth
      # widened from 5s to 10s to pay for it instead.
      MERIDIAN_RPS: "12"
    # 200ms, not one second, and measured rather than chosen: subsampling a
    # 200ms capture of a live board, detected quote changes per second peak at
    # 5.8/s around 200-300ms and fall to 3.5/s at 1s. The old 1s loop was
    # discarding ~40% of observable changes. See docs/infra/live-cadence.md.
    command: ["sh", "-c", "alembic upgrade head && python -m core.live_recorder --interval 0.2"]

  live-odds-recorder:
    build: .
    container_name: meridian-live-odds-recorder
    # Separate from `scheduler` because the scheduler runs every 6 hours, which
    # is why the database holds 3 in-play-adjacent odds rows in total. Book
    # lines move on news, in minutes; a 6-hourly sweep cannot see that, and the
    # news-window detector reported zero triggers largely because of it.
    #
    # NOTE: ESPN publishes NO live in-game odds (measured 2026-08-02 — the
    # scoreboard odds block is empty mid-game and summary.pickcenter is a
    # frozen pregame number). This records *pregame* line movement at fine
    # resolution, and quarantines anything in-game behind a "(live)" provider
    # name if the venue ever starts publishing one. See
    # docs/infra/live-odds.md.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Local postgres is the primary since the 2026-08-17 Supabase exit. A
      # future remote (AWS) is one env var: set MERIDIAN_DATABASE_URL.
      DATABASE_URL: ${MERIDIAN_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
      # ESPN is a separate host from Polymarket and has its own budget. One
      # small scoreboard call per cycle at 15s is ~0.07 req/s against 3.
      ESPN_RPS: "3"
    command: ["python", "-m", "core.feeds.live_odds_recorder", "--interval", "15"]

  kalshi-recorder:
    build: .
    container_name: meridian-kalshi-recorder
    # The second transactable venue (docs/kalshi-recorder.md). Ran twice as a
    # manual foreground process and died twice with its terminal — exactly the
    # failure mode the restart policy exists for. Kalshi snapshots are as
    # unbackfillable as Polymarket's: a pregame price nobody wrote down is gone.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Same app database as the pregame recorder — the venue comparison joins
      # kalshi_snapshots against market_snapshots, so they must live together.
      # Local postgres is the primary since the 2026-08-17 Supabase exit. A
      # future remote (AWS) is one env var: set MERIDIAN_DATABASE_URL.
      DATABASE_URL: ${MERIDIAN_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
      # Kalshi is its own host with its own budget — this does not draw on the
      # Polymarket 20 req/s per-IP split (5 + 12) above. Demand is ~0.2 req/s.
      KALSHI_RPS: "5"
    # alembic upgrade first: the kalshi tables are one revision newer than what
    # a long-running deployment may have, and a recorder that starts before its
    # tables exist crash-loops. Concurrent upgrades from the sibling services
    # are safe — Alembic serializes on a Postgres advisory lock.
    command: ["sh", "-c", "alembic upgrade head && python -m core.kalshi"]

  scheduler:
    build: .
    container_name: meridian-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Local postgres is the primary since the 2026-08-17 Supabase exit. A
      # future remote (AWS) is one env var: set MERIDIAN_DATABASE_URL.
      DATABASE_URL: ${MERIDIAN_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
    # Stats, odds, predictions and resolution every 6h. All of these are
    # backfillable, unlike snapshots, so a missed run costs nothing permanent.
    command: ["sh", "-c", "alembic upgrade head && python -m core.scheduler --interval-hours 6"]

  api:
    build: .
    container_name: meridian-api
    # Until 2026-08-07 this was a host `nohup uvicorn` — the ONLY component
    # that did not survive a reboot, on the machine that must now run two
    # weeks unattended. The fill watcher lives inside this process (the
    # read-back loop belongs next to the write path), so a dead dashboard was
    # also silently a dead fill watcher: pre-authorized exits only fire while
    # this is up.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # All interfaces, DELIBERATELY (operator decision, 2026-08-07): the
      # dashboard is read over the tailnet while the operator is away, and the
      # pre-container uvicorn already ran on 0.0.0.0. The cost is stated
      # plainly: the read endpoints are unauthenticated and now reachable from
      # the LAN as well as the tailnet — the order path alone is gated by
      # MERIDIAN_ORDER_TOKEN. Revert to "127.0.0.1:8008:8008" when remote
      # access is no longer needed.
      - "8008:8008"
    environment:
      # Local postgres is the primary since the 2026-08-17 Supabase exit. A
      # future remote (AWS) is one env var: set MERIDIAN_DATABASE_URL.
      DATABASE_URL: ${MERIDIAN_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
      # The live recorder's heartbeat + tick counts live in local Postgres.
      # From inside the compose network that is `postgres:5432`, not the
      # host's `localhost:5433` default.
      MERIDIAN_LOCAL_DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      # Ordering + fill watcher. All optional: absent means the order path is
      # disabled (403) and the watcher does not start — same as before.
      POLYMARKET_KEY_ID: ${POLYMARKET_KEY_ID:-}
      POLYMARKET_SECRET_KEY: ${POLYMARKET_SECRET_KEY:-}
      MERIDIAN_ORDER_TOKEN: ${MERIDIAN_ORDER_TOKEN:-}
      MERIDIAN_MAX_ORDER_STAKE_USD: ${MERIDIAN_MAX_ORDER_STAKE_USD:-25}
      # BOTH halves of the artifact-root contract, and they only work together
      # (core/paths.py, DATA_DIR_CONTAINER). The volume below puts the host's
      # reports subtree inside the container; this makes `reports_dir()`
      # resolve to it. With the mount alone the default wins and the api reads
      # /app/backups — a path that does not exist in the image — which is why
      # the model performance page said "run `python -m core.analytics` first"
      # no matter how many times the operator ran it.
      MERIDIAN_DATA_DIR: /data
    volumes:
      # reports/ ONLY, not the whole root. The api reads exactly one artifact
      # (analytics.json) and every file it serves otherwise comes from the
      # image's own static/. Mounting the root would additionally hand an
      # unauthenticated service — bound to all interfaces, see the ports note
      # above — read access to the database dumps in ticks/ and supabase/ for
      # no benefit at all.
      #
      # Read-only on purpose too: the api serves this artifact, it never
      # produces it. `python -m core.analytics` is a host job by construction —
      # it reads the standby at localhost:5433, which does not exist in here.
      - ${MERIDIAN_DATA_DIR:-./backups}/reports:/data/reports:ro
    # --host 0.0.0.0 is the container binding; the ports line above is what
    # keeps it loopback-only on the host.
    command: ["sh", "-c", "alembic upgrade head && uvicorn core.api:app --host 0.0.0.0 --port 8008"]

  alerter:
    build: .
    container_name: meridian-alerter
    # Evaluates core/healthchecks.py — the same set scripts/health.py prints —
    # every 5 minutes and pushes transitions to the phone via ntfy. The 9:00 CT
    # digest ALWAYS sends, green or not: it is this container's own liveness
    # proof, so a silent phone always means something (B11, applied to the
    # alarm itself). Its startup push doubles as the reboot notification.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Local postgres is the primary since the 2026-08-17 Supabase exit. A
      # future remote (AWS) is one env var: set MERIDIAN_DATABASE_URL.
      DATABASE_URL: ${MERIDIAN_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
      MERIDIAN_LOCAL_DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      # The topic is the whole security model of ntfy — treat it like a
      # password. The alerter exits loudly if this is unset.
      MERIDIAN_NTFY_TOPIC: ${MERIDIAN_NTFY_TOPIC:-}
      MERIDIAN_NTFY_SERVER: ${MERIDIAN_NTFY_SERVER:-https://ntfy.sh}
      # statvfs on a bind-mounted host directory reports the HOST disk —
      # the one that actually fills — not the Docker VM's overlay filesystem.
      MERIDIAN_DISK_PATH: /hostdisk
    volumes:
      # Any host directory works for the statvfs disk check; the artifact
      # root is the natural one (core/paths.py).
      - ${MERIDIAN_DATA_DIR:-./backups}:/hostdisk:ro
    command: ["sh", "-c", "alembic upgrade head && python -m core.alerter"]

volumes:
  meridian_pgdata:
