services:
  postgres:
    image: postgres:16-alpine
    container_name: meridian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      # 5433 on the host to avoid clashing with any local Postgres on 5432
      - "5433:5432"
    volumes:
      - meridian_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 10

  recorder:
    build: .
    container_name: meridian-recorder
    # The whole point: survives crashes, Docker restarts, and machine reboots.
    # A recorder that dies unattended is the dominant failure mode, and market
    # snapshots cannot be backfilled from anywhere.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Container-to-container, so port 5432 (not the 5433 host mapping).
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
    volumes:
      - ./recorder-logs:/app/logs

  scheduler:
    build: .
    container_name: meridian-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
    # Stats, odds, predictions and resolution every 6h. All of these are
    # backfillable, unlike snapshots, so a missed run costs nothing permanent.
    command: ["sh", "-c", "alembic upgrade head && python -m core.scheduler --interval-hours 6"]

volumes:
  meridian_pgdata:
