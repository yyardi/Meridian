services:
  postgres:
    image: postgres:16-alpine
    container_name: meridian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      # 5433 on the host to avoid clashing with any local Postgres on 5432
      - "5433:5432"
    volumes:
      - meridian_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 10

  recorder:
    build: .
    container_name: meridian-recorder
    # The whole point: survives crashes, Docker restarts, and machine reboots.
    # A recorder that dies unattended is the dominant failure mode, and market
    # snapshots cannot be backfilled from anywhere.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Substituted from .env at runtime so no credential is committed.
      # Falls back to the local container if REMOTE_DATABASE_URL is unset.
      DATABASE_URL: ${REMOTE_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
      # Supabase session mode (5432) caps the PROJECT at 15 clients and four
      # containers plus the dashboard exhaust it. Transaction mode (6543)
      # shares a small server pool across many clients. Alembic still uses
      # DATABASE_URL as given, so migrations keep session mode where their
      # advisory locks work.
      MERIDIAN_TX_POOLER: "1"
      # Two recorders now share one IP and the gateway's ceiling is 20 req/s.
      # The pregame recorder polls hourly and has no latency requirement, so it
      # yields headroom to the live one rather than both sitting at 10 and
      # leaving zero margin. 5 + 12 = 17, under the ceiling.
      MERIDIAN_RPS: "5"
    volumes:
      - ./recorder-logs:/app/logs

  live-recorder:
    build: .
    container_name: meridian-live-recorder
    # Separate from `recorder` on purpose: that one samples the pregame board
    # every 15-60 min, which is right for slow line drift and useless for
    # anything inside a game. In-game prices travel ~37c peak-to-trough, and
    # both unbuilt strategies (in-game trading, market making) need
    # second-scale resolution to be measurable at all.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # LOCAL, deliberately — not the Supabase URL the others use.
      #
      # This container writes ~657,000 rows a day; everything else in the system
      # writes ~5,900. On a shared-CPU instance that pinned Supabase at 99% CPU
      # while exceeding the free tier, and a write that fails mid-game loses
      # that game permanently: Polymarket publishes no price history, so the
      # tick stream cannot be refetched from anywhere.
      #
      # Nothing is lost by keeping it here. The only consumer is the replay
      # engine and the microstructure experiments, and those are *required* to
      # run against local Postgres anyway (11m28s against Supabase versus 13s
      # locally). The old arrangement uploaded every tick and then downloaded
      # it again via `sync_local --stream`.
      #
      # What Supabase keeps: predictions, odds, resolutions, game logs — the
      # ~5,900 rows/day that actually need to survive this laptop.
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      # Supabase session mode (5432) caps the PROJECT at 15 clients and four
      # containers plus the dashboard exhaust it. Transaction mode (6543)
      # shares a small server pool across many clients. Alembic still uses
      # DATABASE_URL as given, so migrations keep session mode where their
      # advisory locks work.
      MERIDIAN_TX_POOLER: "1"
      # Gets the larger share: this is the one with a latency requirement.
      # Measured steady-state demand with a full four-game slate is ~8.9 req/s
      # (5 for the 200ms price loop + near-money depth + a slow deep sweep), so
      # 12 leaves headroom without crowding the gateway's 20 req/s per-IP
      # ceiling. NOT raised when the price loop went from 1s to 200ms — depth
      # widened from 5s to 10s to pay for it instead.
      MERIDIAN_RPS: "12"
    # 200ms, not one second, and measured rather than chosen: subsampling a
    # 200ms capture of a live board, detected quote changes per second peak at
    # 5.8/s around 200-300ms and fall to 3.5/s at 1s. The old 1s loop was
    # discarding ~40% of observable changes. See docs/infra/live-cadence.md.
    command: ["sh", "-c", "alembic upgrade head && python -m core.live_recorder --interval 0.2"]

  live-odds-recorder:
    build: .
    container_name: meridian-live-odds-recorder
    # Separate from `scheduler` because the scheduler runs every 6 hours, which
    # is why the database holds 3 in-play-adjacent odds rows in total. Book
    # lines move on news, in minutes; a 6-hourly sweep cannot see that, and the
    # news-window detector reported zero triggers largely because of it.
    #
    # NOTE: ESPN publishes NO live in-game odds (measured 2026-08-02 — the
    # scoreboard odds block is empty mid-game and summary.pickcenter is a
    # frozen pregame number). This records *pregame* line movement at fine
    # resolution, and quarantines anything in-game behind a "(live)" provider
    # name if the venue ever starts publishing one. See
    # docs/infra/live-odds.md.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${REMOTE_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
      # Supabase session mode (5432) caps the PROJECT at 15 clients and four
      # containers plus the dashboard exhaust it. Transaction mode (6543)
      # shares a small server pool across many clients. Alembic still uses
      # DATABASE_URL as given, so migrations keep session mode where their
      # advisory locks work.
      MERIDIAN_TX_POOLER: "1"
      # ESPN is a separate host from Polymarket and has its own budget. One
      # small scoreboard call per cycle at 15s is ~0.07 req/s against 3.
      ESPN_RPS: "3"
    command: ["python", "-m", "core.feeds.live_odds_recorder", "--interval", "15"]

  scheduler:
    build: .
    container_name: meridian-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${REMOTE_DATABASE_URL:-postgresql+psycopg://meridian:meridian@postgres:5432/meridian}
      # Supabase session mode (5432) caps the PROJECT at 15 clients and four
      # containers plus the dashboard exhaust it. Transaction mode (6543)
      # shares a small server pool across many clients. Alembic still uses
      # DATABASE_URL as given, so migrations keep session mode where their
      # advisory locks work.
      MERIDIAN_TX_POOLER: "1"
    # Stats, odds, predictions and resolution every 6h. All of these are
    # backfillable, unlike snapshots, so a missed run costs nothing permanent.
    command: ["sh", "-c", "alembic upgrade head && python -m core.scheduler --interval-hours 6"]

volumes:
  meridian_pgdata:
