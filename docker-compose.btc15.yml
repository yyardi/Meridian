# BTC Up-or-Down overlay (2026-09-28): the LLM decision harness, Polymarket US.
#
#   docker compose -f docker-compose.yml -f docker-compose.btc15.yml up -d btc15 btc1h
#
# btc15 trades the 15-minute market, btc1h the hourly one; each is one ~30 MB
# process with its OWN SQLite ledger and its own $10 drawdown allocation. They poll
# four free exchanges once a second, decide once per window through OpenAI, fill at
# the ask (PAPER by default), and settle off the venue's own resolution. Kalshi's
# KXBTC15M -- the same contract on the same BRTI averages -- is read for the
# 15-minute instance's reference price. The ledgers live under
# /opt/meridian/artifacts/btc15, deliberately NOT the shared Postgres, which was
# OOM-killed three times on 2026-09-26/27.
#
# To let them decide, add to /opt/meridian/.env and re-run the command above:
#   OPENAI_API_KEY=...
#   MERIDIAN_BTC15_MODEL=<an id from: docker compose -f docker-compose.yml -f docker-compose.btc15.yml
#                          run --rm btc15 python -m core.btc15.harness --check-openai>
# Without them they record the price feed, every window's features and every result.
#
# core/ is mounted, so a code deploy is a checkout and a restart, never an image build.
x-btc: &btc
  image: meridian-api:latest
  restart: unless-stopped
  command: ["python", "-m", "core.btc15.harness"]
  working_dir: /app
  mem_limit: 256m
  volumes:
    - /opt/meridian/core:/app/core:ro
    - /opt/meridian/artifacts/btc15:/data
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

x-btc-env: &btc_env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  MERIDIAN_BTC15_MODEL: ${MERIDIAN_BTC15_MODEL:-}
  # Iteration 1 left this blank and the model spent at most 71 thinking tokens a call;
  # high effort measured 2026-09-28: ~350 thinking tokens, ~15 s, ~$0.08 a decision.
  MERIDIAN_BTC15_REASONING_EFFORT: ${MERIDIAN_BTC15_REASONING_EFFORT:-high}
  MERIDIAN_BTC15_LESSON_REASONING_EFFORT: ${MERIDIAN_BTC15_LESSON_REASONING_EFFORT:-low}
  MERIDIAN_BTC15_MODE: ${MERIDIAN_BTC15_MODE:-paper}
  MERIDIAN_BTC15_VENUE: polymarket
  # The arms price off the venue's market-data STREAM (core/btc15/stream_book.py): its REST
  # book is a 30-s Cloudflare cache. The stream is signed with the venue key; the harness
  # opens only the public markets socket and has no order path.
  POLYMARKET_KEY_ID: ${POLYMARKET_KEY_ID:-}
  POLYMARKET_SECRET_KEY: ${POLYMARKET_SECRET_KEY:-}
  MERIDIAN_BTC15_DRAWDOWN_USD: "10"
  MERIDIAN_BTC15_MAX_USD_PER_DAY: ${MERIDIAN_BTC15_MAX_USD_PER_DAY:-10}
  MERIDIAN_BTC15_MAX_TOKENS_PER_DAY: ${MERIDIAN_BTC15_MAX_TOKENS_PER_DAY:-1500000}
  MERIDIAN_BTC15_MAX_OUTPUT_TOKENS: ${MERIDIAN_BTC15_MAX_OUTPUT_TOKENS:-4000}
  # 2026-09-30: the sub-second record (every venue book message and print, spot from the
  # exchanges' sockets) beside the ledger; "none" disables it. Spot sockets (Coinbase, Kraken)
  # are on by default; "0" keeps the four REST polls only.
  MERIDIAN_BTC15_MICROTAPE: ${MERIDIAN_BTC15_MICROTAPE:-}
  MERIDIAN_BTC15_SPOT_SOCKETS: ${MERIDIAN_BTC15_SPOT_SOCKETS:-1}
  # Kalshi's relay of BRTI (the settlement index) is recorded when a Kalshi API key exists:
  # KALSHI_API_KEY_ID and KALSHI_PRIVATE_KEY_B64 (the key's PEM, base64 on one line:
  # `base64 -w0 kalshi.pem`) in /opt/meridian/.env beside the other secrets. The bots mount no
  # host path, and artifacts/btc15 is mounted into the dashboard's container too, so a key file
  # never goes there. Read-only feed; without a key, or with one that does not load, the
  # 15-minute bot logs one line and runs as before.
  KALSHI_API_KEY_ID: ${KALSHI_API_KEY_ID:-}
  KALSHI_PRIVATE_KEY_B64: ${KALSHI_PRIVATE_KEY_B64:-}
  MERIDIAN_NTFY_TOPIC: ${MERIDIAN_NTFY_TOPIC:-}
  MERIDIAN_NTFY_SCOPE: ${MERIDIAN_NTFY_SCOPE:-}
  MERIDIAN_NTFY_SERVER: ${MERIDIAN_NTFY_SERVER:-}
  PYTHONUNBUFFERED: "1"

services:
  btc15:
    <<: *btc
    container_name: meridian-btc15
    environment:
      <<: *btc_env
      MERIDIAN_BTC15_HORIZON: 15m
      # 2026-09-30 22:20Z, the operator's rule (retire what does not trade): the model is off
      # here. Its per-window call was the only OpenAI spend (~$10/day) and the agent arm made
      # two trades, both losers, in five hours of live prices. The makers need no model. To
      # turn it back on, delete this line; the key and model id stay in .env.
      MERIDIAN_BTC15_MODEL: ""
      MERIDIAN_BTC15_DECIDE_AT_S: ${MERIDIAN_BTC15_DECIDE_AT_S:-30}
      MERIDIAN_BTC15_MAX_USD_PER_DAY: ${MERIDIAN_BTC15_MAX_USD_PER_DAY_15M:-15}
      MERIDIAN_BTC15_SECOND_LOOK_S: "360"
      MERIDIAN_BTC15_DB: /data/polymarket-15m.sqlite
      MERIDIAN_BTC15_STATUS: /data/status-15m.json

  btc1h:
    <<: *btc
    container_name: meridian-btc1h
    environment:
      <<: *btc_env
      # hourly: DATA ONLY by default (no model calls, no credits) and paper; give it
      # a model with MERIDIAN_BTC1H_MODEL once the 15-minute run has earned it
      MERIDIAN_BTC15_MODEL: ${MERIDIAN_BTC1H_MODEL:-}
      MERIDIAN_BTC15_MODE: paper
      MERIDIAN_BTC15_HORIZON: 1h
      MERIDIAN_BTC15_MAX_USD_PER_DAY: ${MERIDIAN_BTC15_MAX_USD_PER_DAY_1H:-5}
      MERIDIAN_BTC15_SECOND_LOOK_S: "1800"
      # the hourly bot (2026-09-29): Kalshi lists no hourly twin and the model is off here to
      # save credits. 2026-09-30: one maker arm, judged by prints, so the hourly book and its
      # prints are taped (the stream subscribes only when an arm runs) -- no Kalshi-priced arm.
      # 2026-10-01 16:10:27Z: the spot trigger's twin runs beside the control (the registered
      # read is in docs/math/btc15-v2-arms.md, "The hourly A/B"). The twin needs the coinbase
      # socket, so spot sockets are on here too and the hourly tape carries spot as well: a
      # duplicate of the 15-minute bot's, ~33 MB/day under the tape's 3-day retention.
      MERIDIAN_BTC15_ARMS: '[{"name": "touch_maker", "prob": "mid", "kind": "join", "margin": 0.0}, {"name": "touch_maker_t", "prob": "mid", "kind": "join", "margin": 0.0, "spot_pull_usd": 10.0}]'
      MERIDIAN_BTC15_SPOT_SOCKETS: "1"
      MERIDIAN_BTC15_DECIDE_AT_S: "60"
      MERIDIAN_BTC15_MIN_LEAD_S: "180"
      MERIDIAN_BTC15_DB: /data/polymarket-1h.sqlite
      MERIDIAN_BTC15_STATUS: /data/status-1h.json
